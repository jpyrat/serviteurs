<BOUCLE_(ARTICLES){page=intentions_prieres}>
<div class="contentArticle sans-padding" id="ancre_intentions" role="main">
  <article>
    <header class="avec-padding-bottom" style="max-width: 62.5em;margin:0 auto;border-top: 1px solid #ccc;">
      <h1 class="texte-colorGrisFonce text-center avec-padding-top #EDIT{titre}">#TITRE</h1>
    </header>
    <div class="container avec-padding-bottom"[ style="background: #444444 url('(#CHEMIN{css/img/fond_intention_priere.jpg})') top center no-repeat"]
    data-enllax-ratio="0.2">
      <div class="pave-content row avec-padding-top avec-padding-bottom">
        <div class="formulaire-intentions medium-5 medium-push-7 columns avec-margin-top avec-padding">
          <h2 class="text-transform-none">Déposer une intention de prière</h2>
          #FORMULAIRE_FORMIDABLE{intentions_prieres}
        </div>
        <div class="medium-7 medium-pull-5 columns avec-margin-top texte-blanc #EDIT{texte}">
          [(#TEXTE|image_reduire{670,0})]
        </div>
      </div>
      <div class="row columns avec-padding-top avec-padding-bottom avec-margin-top avec-margin-bottom">
        <h2 class="hide">Les prières déposées</h2>
        <ul class="prieres menu simple text-center">
		  <BOUCLE_IP(FORMULAIRES_REPONSES){id_formulaire=27}{!par date}{age<90}>
          <li><a class="avec-padding" href="#" title="[(#VOIR_REPONSE{ligne_1, valeur_uniquement}|attribut_html)]">[<img src="(#CHEMIN{css/img/intention_priere.png})" alt="[(#VOIR_REPONSE{ligne_1, valeur_uniquement}|attribut_html)]" />]</a></li>
		  </BOUCLE_IP>
        </ul>
      </div>
    </div>
  </article>

  <INCLURE{fond=inclure/documents,env} />

</div>

[<script type="text/javascript" src="(#CHEMIN{js/jquery.enllax.min.js})"></script>]
<script type="text/javascript">
  $(document).ready( function() {
    // init parallax
    $(window).enllax();
  });
</script>
</BOUCLE_>
