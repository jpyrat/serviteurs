<BOUCLE_(ARTICLES){id_article}{statut IN publie,archive}>
<div class="row column">
  [(#REM) le breadcrumb ]
  <nav class="show-for-large" aria-label="Vous êtes ici :" role="navigation">
    <ul class="breadcrumbs">
      <li><a href="#URL_SITE_SPIP" title="Retour à l'accueil"><span class="icon-home texte-triadeB"></span></a></li>
      <BOUCLE_Breadcrumbs(HIERARCHIE){id_article}>
      <li><a href="#URL_RUBRIQUE" title="Voir la rubrique [(#TITRE|attribut_html)]">#TITRE</a></li>
      </BOUCLE_Breadcrumbs>
      <li title="En cours: [(#TITRE|attribut_html)]">
        <span class="show-for-sr">En cours: </span>#TITRE
      </li>
    </ul>
  </nav>
</div>

<div class="contentArticle row column avec-margin-bottom" id="ancre_article" role="main">
  <article>
    <header class="avec-padding-bottom">
      <h1 class="texte-colorComm text-center">#TITRE[(#STATUT|=={archive}|?{'<span class"archive"> (archivé)</span>',''})]</h1>
      [<div class="sous-titre texte-colorGrisFonce font-style-italic avec-padding-top05">(#SOUSTITRE)</div>]
      <div class="#EDIT{chapo} chapo">
        #CHAPO
      </div>
      <div class="auteur show-for-medium">
        <a class="texte-colorComm" href="#" title="Envoyer un message à l'auteur">
          <span class="icon-envelope icon-2x"></span>
          Écrire à l'auteur
        </a>
      </div>
      [<figure class="text-center sans-margin avec-margin-top avec-margin-bottom">
        <img src="(#LOGO_ARTICLE|image_reduire{800,600}|extraire_attribut{src})" alt="" />
      </figure>]
    </header>
    <div class="row container avec-padding-top avec-padding-bottom avec-border-top">
      <div class="#EDIT{texte} texte large-8 columns avec-padding-top">
        #TEXTE
        <div class="auteur show-for-small-only text-center"><a class="texte-colorComm" href="#" title="Envoyer un message à l'auteur"><span class="icon-envelope icon-2x"></span>Écrire à l'auteur</a></div>
        <hr />
        <h3 class="show-for-medium avec-margin-bottom05" id="social-tags">Partager cette page</h3>
      </div>
      <aside class="large-4 columns">
        <INCLURE{fond=_bibliotheque/pave-evenement-article,env} />

        <section class="text-center">
          <h1 class="text-center text-transform-none">Sur le même thème</h1>
          <BOUCLE_apa(ARTICLES){id_rubrique}{par num titre}{0,4}>
          <article class="triadeC avec-padding avec-margin-bottom015">
            <h2>
              <a class="texte-colorGrisFonce" href="#URL_ARTICLE" title="Lire [(#TITRE|attribut_html)]">#TITRE</a>
            </h2>
              [<div class="sous-titre texte-colorGrisFonce font-style-italic avec-padding-top05">
                (#SOUSTITRE)
              </div>]
          </article>
          </BOUCLE_apa>
        </section>

        <INCLURE{fond=inclure/telecharger,env} />

      </aside>
  </article>

  <INCLURE{fond=inclure/documents,env} />

</div>
</BOUCLE_>
