<BOUCLE_(RUBRIQUES){id_rubrique}>
<div class="row column">
	[(#REM) le breadcrumb ]
	<nav class="show-for-large" aria-label="Vous êtes ici :" role="navigation">
		<ul class="breadcrumbs">
			<li><a href="#URL_SITE_SPIP" title="Retour à l'accueil"><span class="icon-home texte-triadeB"></span></a></li>
			<BOUCLE_Breadcrumbs(HIERARCHIE){id_rubrique}>
			<li><a href="#URL_RUBRIQUE" title="Voir la rubrique [(#TITRE|attribut_html)]">#TITRE</a></li>
			</BOUCLE_Breadcrumbs>
			<li title="En cours: [(#TITRE|attribut_html)]">
				<span class="show-for-sr">En cours: </span>#TITRE
			</li>
		</ul>
	</nav>
</div>

[(#REM) 3 article en focus ]
<div class="contentRubrique row column text-center" id="ancre_rubrique">
	<h1 class="texte-<INCLURE{fond=inclure/colorespace,id_secteur=#ID_SECTEUR}> #EDIT{titre}">#TITRE</h1>
	[<div class="sous-titre texte-colorGrisFonce font-style-italic avec-padding-right05 avec-padding-left05 avec-padding-top05 #EDIT{texte}">(#TEXTE|image_reduire{1170,0})</div>]
	<BOUCLE_a(ARTICLES){id_rubrique}{par num titre}{!par date_modif}{0,3}{doublons}>
	<article class="focus row text-center">
		<a href="#URL_ARTICLE" title="Lire [(#TITRE|attribut_html)]">
			<div class="large-4	columns avec-padding-bottom avec-margin-bottom">
				[(#REM) img 400x270 ]
				[<img src="(#LOGO_ARTICLE|focusimage{400,290,center}|extraire_attribut{src})" alt="">]
			</div>
			<div class="large-8	columns large-text-left">
				<h2 class="position-relative z-index-999 #EDIT{titre}">#TITRE
					<span class="chevron icon-chevron-thin-right show-for-large"></span>
				</h2>
				[<div class="sous-titre texte-colorGrisFonce font-style-italic #EDIT{soustitre}">(#SOUSTITRE)</div>]
				[<div class="#EDIT{introduction}">(#CHAPO|sinon{#DESCRIPTIF})</div>]
			</div>
		</a>
	</article>
	</BOUCLE_a>
	<BOUCLE_r(RUBRIQUES){id_parent}{par num titre}>
	<article class="focus row text-center">
		<a href="#URL_RUBRIQUE" title="Consulter [(#TITRE|attribut_html)]">
			<div class="large-4	columns avec-padding-bottom avec-margin-bottom">
				[(#REM) img 400x270 ]
				[<img src="(#LOGO_RUBRIQUE|focusimage{400,290,center}|extraire_attribut{src})" alt="">]
			</div>
			<div class="large-8	columns large-text-left">
				<h2 class="position-relative z-index-999 #EDIT{titre}">#TITRE
					<span class="chevron icon-chevron-thin-right show-for-large"></span>
				</h2>
				[<div class="#EDIT{descriptif}"><p>(#DESCRIPTIF|sinon{#CHAPO})</p></div>]
			</div>
		</a>
	</article>
	</BOUCLE_r>
	<//B_a>

	<INCLURE{fond=_bibliotheque/pave-pagination_articles_rubrique,doublons,env,ajax} />

</div>
</BOUCLE_>
