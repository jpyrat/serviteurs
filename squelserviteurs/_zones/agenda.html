<div class="zone-arriere avec-padding" id="ancre_agenda"
		style="background: #EDE0CE url([(#CHEMIN{css/img/AdobeStock_74641866.jpg})]) no-repeat top center; background-size: cover;"
		data-enllax-ratio="0.4"
		 >
	<div class="agenda row column">
		<INCLURE{fond=_bibliotheque/pave-pastille-titre}
			{titrepastille='Agenda'}
			{pictopastille='icon-calendar-check-o'}
			{couleurpastille='texte-triadeA'}
		/>
		<article class="agenda-calendrier avec-margin-bottom avec-padding-bottom">
			<div class="agenda-calendrier-content row">
				<div class="large-8 columns large-push-4" id="agenda-boutons-filtre">
					<div class="row align-center bouton-filtre">
						<BOUCLE_Lieux(MOTS){id_groupe=35}{par num titre}>
						<BOUCLE_AuMoinsUnEvenement(EVENEMENTS){id_mot}{age_fin<0}{statut=publie}{0,1}>
						<div class="medium-4 columns text-center">
							<a class="[(#_Lieux:DESCRIPTIF|attribut_html)] ajax" href="[(#SELF|parametre_url{mots\[\],#_Lieux:ID_MOT})]#agenda-boutons-filtre" title="[(#_Lieux:TEXTE|ptobr|attribut_html)]">#_Lieux:TITRE</a>
						</div>
						</BOUCLE_AuMoinsUnEvenement>
						</BOUCLE_Lieux>
					</div>
					<B_PourQui>
					<div class="sans-padding avec-margin-bottom-for-medium">
						<ul class="dropdown menu" data-dropdown-menu role="navigation">
							<li>
								<form action="#SELF#agenda-boutons-filtre" method="get" class="ajax">
									<div class="sans-padding">
									<select name="mots\[\]" onchange='this.form.submit();'>
										<option title="Choisir le public concerné" value="">Pour qui ?</option>
										<BOUCLE_PourQui(MOTS){id_groupe=34}{par num titre, titre}><B_EvenementsPourQui>
										<BOUCLE_EvenementsPourQui(EVENEMENTS){id_mot}{pagination 1}>
										<option value="#ID_MOT"[(#ID_MOT|in_array{#ENV{mots,#ARRAY}}|oui) selected="selected"]>#_PourQui:TITRE (#GRAND_TOTAL)</option>
										</BOUCLE_EvenementsPourQui>
										</B_EvenementsPourQui></BOUCLE_PourQui>
									</select>
									</div>
								</form>
							</li>
						</ul>
					</div>
					</B_PourQui>
					[(#REM) le calendrier ]
					<INCLURE{fond=_bibliotheque/agenda,env} />
					<div class="sans-padding avec-margin-bottom">
						<ul class="dropdown menu" data-dropdown-menu role="navigation">
							<li>
								<a href="#" title="Choisir le lieu concerné">Participer à nos offices</a>
								<ul class="menu vertical">
									<li><a href="#URL_RUBRIQUE{245}" title="Offices d’Ourscamp">Ourscamp</a></li>
									<!--<li><a href="#URL_RUBRIQUE{268}" title="Offices d’Ottmarsheim">Ottmarsheim</a></li>
									<li><a href="#URL_RUBRIQUE{344}" title="Offices des Œuvres de jeunesse">Œuvres de jeunesse</a></li>-->
								</ul>
							</li>
						</ul>
					</div>
				</div>
				<nav class="large-4 columns large-pull-8" role="navigation">
					<div class="listeEvenementsAgenda">
						<h3 class="hide">Événements</h3>
						<INCLURE{fond=_bibliotheque/pave-evenement-rubrique,env,ajax} />
					</div>
				</nav>
			</div>
		</article>

	</div>
</div>

[<script type="text/javascript" src="(#CHEMIN{js/jquery.enllax.min.js})"></script>
<script type="text/javascript">
	$(document).ready( function() {
		// init parallax avec un timeout, même de 0, pour éviter le conflit avec SlickSlider :-(((......
		setTimeout(function() {
			$(window).enllax();
		}, 0);
	});
</script>]
