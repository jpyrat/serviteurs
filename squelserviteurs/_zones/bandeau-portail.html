<div class="zone-arriere avec-padding">
  <div class="bandeau-portail row text-center">
    <div class="large-6 medium-8 small-centered column">
      <h1 class="hide">Les serviteurs de Jésus & Marie</h1>
      [<img src="(#CSS{css/img/logo_serviteurs.png})" alt="Serviteurs de Jésus & de Marie" />]
      <section class="recherche avec-margin">
        <form action="?page=recherche" method="get" style="position: relative;">
          <label for="champRecherche" style="display:none">Rechercher :</label>
          <input class="search text triadeC"
                 id="champRecherche"
                 name="recherche"
                 title="Saisir de 3 à 30 caractères"
                 required="required"
                 pattern="[\D\d\s]{3,30}"
                 maxlength="30"
                 placeholder="recherche"
                 type="search"
                 style="padding-left: 5em;">
          <button name="button" title="Lancer la recherche" type="submit">
            <span class="icon-search texte-triadeA" style="padding-top:.1em;"></span>
          </button>
        </form>
      </section>
    </div>
  </div>
</div>
