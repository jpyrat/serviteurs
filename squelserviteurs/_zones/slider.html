<BOUCLE_Grappe(GRAPPES){identifiant=carrouselaccueil}>
<B_Articles>
<div class="zone-arriere avec-margin-top" id="zone-actus">
	<div class="slider-slick" role="region" aria-label="Diaporama d'accueil">
		<BOUCLE_Articles(ARTICLES grappes){id_grappe}{tout}{statut=publie}{par grappes_liens.rang_lien, num titre}>
		<div>
			<a class="slider-lien" href="#URL_ARTICLE" title="Lire l'article [(#TITRE|attribut_html)]">
				<div class="slider-content text-center">
					<header>
						<h3>#TITRE</h3>
						[<h4>(#SOUSTITRE)</h4>]
					</header>
					[<img class="" src="(#LOGO_ARTICLE|image_recadre{400:500,-,focus}|image_reduire{400,500}|extraire_attribut{src}|sinon{''}|supprimer_timestamp)" alt="" />]
				</div>
				<footer class="show-for-medium">
					<p class="slider-content-titre h3 show-for-large">#TITRE</p>
					[<p class="slider-content-soustitre h4 show-for-large">(#SOUSTITRE)</p>]
					[<p class="slider-content-descriptif sans-margin">
						<span class="icon-minus show-for-large"></span>
						(#DESCRIPTIF|ptobr|couper{150})</p>]
					<p><span class="icon-chevron-thin-down avec-margin-top05"></span></p>
				</footer>
			</a>
		</div>
		</BOUCLE_Articles>
	</div>
</div>
</B_Articles>

[(#REM) chargement du script Slick ]
<script type="text/javascript" src="#CHEMIN{lib/slick/slick.min.js}"></script>

</BOUCLE_Grappe>
