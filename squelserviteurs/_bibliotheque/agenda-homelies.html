<div class="row column">
    <div id="calendrier-loading" style="display:none;"><:organiseur:loading:></div>
	<script type='text/javascript' src='[(#CHEMIN{lib/fullcalendar/index.global.js}|timestamp)]'></script>
	<script type='text/javascript' src='[(#CHEMIN{lib/fullcalendar/locales-all.global.js}|timestamp)]'></script>
    <div id="agenda"></div>

    <script type="text/javascript">
    /*<![CDATA[*/
	var agendaSource = "[(#URL_PAGE{homelies.json}
            |parametre_url{id_rubrique,#ENV{id_rubrique}}
            |parametre_url{id_auteur,#ENV{id_auteur}}
            |parametre_url{mots,#ENV{mots}}
            |parametre_url{motstheme,#ENV{motstheme}}
            |parametre_url{motscible,#ENV{motscible}}
            |parametre_url{motszone,#ENV{motszone}}
            |parametre_url{recherche,#ENV{recherche}}
            |replace{&amp;,&})]";
    jQuery(document).ready(function() {
		// page is now ready, initialize the calendar...
		var calendarEl = document.getElementById('agenda');
		var is_ltr = [(#LANG_DIR|=={ltr}|?{true,false})];

		calendar = new FullCalendar.Calendar(calendarEl, {			locale : '[(#LANG|strtolower)]',
            editable: false,
            eventSources: [agendaSource],
			cache: true,
			dayMaxEventRows: true,
			initialView: $(window).width() <= 1024 ? 'listMonth' : 'dayGridMonth',
			headerToolbar: {
				left: (is_ltr ? 'prevYear,prev,next,nextYear today' : 'listMonth,dayGridMonth,dayGridWeek,dayGridDay'),
                center: 'title',
				right: (is_ltr ? 'dayGridDay,dayGridWeek,dayGridMonth,listMonth' : 'today nextYear,next,prev,prevYear')
			},
            firstDay: 1,
            weekMode : 'liquid',
            loading: function(bool) {
				if (bool) {
					$('#agenda-loading').show();
				} else {
					$('#agenda-loading').hide();
				}
            },
            minTime:"8",
            axisFormat: "H'h'(mm)",
            allDayText:'<:organiseur:cal_jour_entier|attribut_html:>',
            dayClick: function(date, allDay, jsEvent, view) {
                if(view.name=='month'){
                  $('.fc-button-agendaWeek').click();
                  $('#agenda').fullCalendar( 'gotoDate', date );
                }
                else
                  if(view.name=='agendaWeek'){
                    $('.fc-button-agendaDay').click();
                    $('#agenda').fullCalendar( 'gotoDate', date );
                  }
            },
            isRTL : [(#LANG_DIR|=={rtl}|?{true,false})],
            eventMouseover: function(event, element) {
                              var tooltipcontent = event.lieu + event.adresse;
                              if (tooltipcontent) {
                                var tooltip =
                                  '<div class="infoBulle" style="position:absolute;z-index:10001;">'
                                  + tooltipcontent +
                                  '</div>';
                                }
                $("body").append(tooltip);
                $(this).mouseover(function(e) {
                  $(this).css('z-index', 10000);
                  $('.infoBulle').fadeIn('500');
                  $('.infoBulle').fadeTo('10', 1.9);
                }).mousemove(function(e) {
                  $('.infoBulle').css('top', e.pageY + 17);
                  $('.infoBulle').css('left', e.pageX - 30);
                });
            },
            eventMouseout: function(event, element) {
              $(this).css('z-index', 8);
              $('.infoBulle').remove();
            },
			windowResize: function(){
				if ($(window).width() <= 1024) {
					calendar.changeView('listMonth');
				}
			}
		});
		calendar.render();
    });
	function majAgenda(source) {
          $('#agenda').fullCalendar('removeEventSource', agendaSource);
          $('#agenda').fullCalendar('refetchEvents');
          agendaSource = source;
          $('#agenda').fullCalendar('addEventSource', agendaSource);
          $('#agenda').fullCalendar('refetchEvents');
	}
    /*]]>*/
    </script>

</div>
