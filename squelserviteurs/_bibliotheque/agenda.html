<div class="row column show-for-medium">
    <link rel='stylesheet' type='text/css' href='#CHEMIN{lib/fullcalendar/fullcalendar.min.css}' />
    <script type='text/javascript' src='#CHEMIN{lib/moment/moment-with-locales.min.js}'></script>
    <script type='text/javascript' src='#CHEMIN{lib/fullcalendar/fullcalendar.min.js}'></script>
    <script type='text/javascript' src='#CHEMIN{lib/fullcalendar/locale-all.js}'></script>
    <div id="agenda"></div>


    <script type="text/javascript">
    /*<![CDATA[*/
	var agendaSource = "[(#URL_PAGE{agenda.json}
            |parametre_url{mots,#ENV{mots}}
            |replace{&amp;,&})]";
    jQuery(document).ready(function() {
        $('#agenda').fullCalendar({
			locale : '[(#LANG|strtolower)]',
            editable: false,
            eventSources: [agendaSource],
			cache: true,
            header: {
                left: 'prevYear,prev,next,nextYear today',
                center: 'title',
                right: 'month,agendaWeek,agendaDay,listMonth'
            },
            firstDay: 1,
            weekMode : 'liquid',
            loading: function(bool) {
              if (bool) $('#calendrier-loading').show();
              else $('#calendrier-loading').hide();
            },
            minTime:"8",
            axisFormat: "H[h](mm)",
			timeFormat: "H[h](mm)",
            allDayText:'<:organiseur:cal_jour_entier|attribut_html:>',
            dayClick: function(date, allDay, jsEvent, view) {
                if(view.name=='month'){
                  $('.fc-button-agendaWeek').click();
                  $('#calendrier').fullCalendar( 'gotoDate', date );
                }
                else
                  if(view.name=='agendaWeek'){
                    $('.fc-button-agendaDay').click();
                    $('#calendrier').fullCalendar( 'gotoDate', date );
                  }
            },
            isRTL : [(#LANG_DIR|=={rtl}|?{true,false})],
            eventMouseover: function(event, element) {
                              var tooltipcontent = event.lieu + event.adresse;
                              if (tooltipcontent) {
                                var tooltip =
                                  '<div class="infoBulle" style="position:absolute;z-index:10001;">'
                                  + tooltipcontent +
                                  '</div>';
                                }
                $("body").append(tooltip);
                $(this).mouseover(function(e) {
                  $(this).css('z-index', 10000);
                  $('.infoBulle').fadeIn('500');
                  $('.infoBulle').fadeTo('10', 1.9);
                }).mousemove(function(e) {
                  $('.infoBulle').css('top', e.pageY + 17);
                  $('.infoBulle').css('left', e.pageX - 30);
                });
            },
            eventMouseout: function(event, element) {
              $(this).css('z-index', 8);
              $('.infoBulle').remove();
            }
        })

    });
	function majAgenda(source) {
          $('#agenda').fullCalendar('removeEventSource', agendaSource);
          $('#agenda').fullCalendar('refetchEvents');
          agendaSource = source;
          $('#agenda').fullCalendar('addEventSource', agendaSource);
          $('#agenda').fullCalendar('refetchEvents');
	}
    /*]]>*/
    </script>

</div>
