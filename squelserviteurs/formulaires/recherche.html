      <section class="recherche avec-margin">
        <form action="[(#ENV{action})]" method="get" style="position: relative;">
		[(#ENV{action}|form_hidden)]
		[<input type="hidden" name="lang" value="(#ENV{lang})" />]
          <label for="champRecherche" style="display:none">Rechercher :</label>
          <input class="search text triadeC"
                 id="champRecherche"
                 name="recherche"
                 title="Saisir de 3 à 30 caractères"
                 required="required"
                 pattern="[\D\d\s]{3,30}"
                 maxlength="30"
                 placeholder="recherche"
				 [value="(#ENV{recherche})"]
                 type="search"
                 style="padding-left: 5em;"
				 autocapitalize="off" autocorrect="off">
          <button title="Lancer la recherche" type="submit">
            <span class="icon-search texte-triadeA" style="padding-top:.1em;"></span>
          </button>
        </form>
      </section>
