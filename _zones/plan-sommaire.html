<div class="zone-arriere avec-padding" id="ancre_plan-sommaire">
	<div class="plan-sommaire row column">
		<h1 class="hide">Plan du site / Présentation</h1>
		<BOUCLE_ListeRubriques(RUBRIQUES){racine}{id_rubrique !IN 1,273,280}{par num titre}>
		<article class="row text-center">
			<div class="large-4 medium-6 columns sans-padding-for-small">
				[(#REM) img 400x270 ]
				[<img src="(#LOGO_RUBRIQUE_SURVOL|sinon{#LOGO_RUBRIQUE_NORMAL}|focusimage{400,270,center}|extraire_attribut{src}|sinon{https://placehold.it/400x270})" alt="" />]
				<h2 class="hide-for-medium <INCLURE{fond=inclure/colorespace,id_secteur=#ID_SECTEUR}> opacity-70">
					<a class="texte-blanc" href="#URL_RUBRIQUE">#TITRE</a>
				</h2>
			</div>
			<div class="large-8 medium-6 columns medium-text-left">
				<h2 class="show-for-medium position-relative z-index-999 #EDIT{titre}">
					<a class="texte-<INCLURE{fond=inclure/colorespace,id_secteur=#ID_SECTEUR}>" href="#URL_RUBRIQUE">#TITRE
					<span class="chevron icon-chevron-thin-right show-for-large"></span>
					</a>
				</h2>
				<div class="row">
					<div class="large-5 columns collapse">
						<B_SsRubriques>
						<ul class="menu vertical">
										<BOUCLE_SsRubriques(RUBRIQUES){id_parent}{par num titre}>
							<li class="#EDIT{titre}"><a href="#URL_RUBRIQUE">#TITRE</a></li>
							</BOUCLE_SsRubriques>
						</ul>
						</B_SsRubriques>
					</div>
					[<div class="large-7 columns show-for-large sans-padding #EDIT{descriptif}">
						(#DESCRIPTIF)
					</div>]
				</div>
			</div>
		</article>
	</BOUCLE_ListeRubriques>
	</div>
</div>
