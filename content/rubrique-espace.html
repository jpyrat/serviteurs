<BOUCLE_(RUBRIQUES){id_rubrique}>
<div class="contentEspace row" id="ancre_espace">
	<div class="bandeau-espace text-center avec-margin-bottom">
		[<img src="(#LOGO_RUBRIQUE_NORMAL|focusimage{1200,320,center}|extraire_attribut{src}|sinon{https://placehold.it/1200x320})" alt="">]
		<h1 class="<INCLURE{fond=inclure/colorespace,id_secteur=#ID_SECTEUR}> #EDIT{titre}">#TITRE</h1>
	</div>
	[<div class="sous-titre texte-colorGrisFonce font-style-italic avec-padding-right05 avec-padding-left05 avec-padding-top05 #EDIT{texte}">(#TEXTE|image_reduire{1170,0})</div>]
	<INCLURE{fond=_zones/annonce,env,ajax} />

	<B_a>
	<div class="large-8 columns avec-margin-top avec-margin-bottom avec-padding-bottom">
		<BOUCLE_a(ARTICLES){id_rubrique}{par num titre}{!par date_modif}>
		<article class="focus row text-center">
			<a href="#URL_ARTICLE" title="Lire [(#TITRE|attribut_html)]">
				<div class="large-6	columns avec-padding-bottom avec-margin-bottom">
					[(#REM) img 400x290 ]
					[<img src="(#LOGO_ARTICLE_NORMAL|focusimage{400,290,center}|extraire_attribut{src})" alt="">]
				</div>
				<div class="large-6	columns large-text-left">
					<h2 class="position-relative z-index-999 #EDIT{titre}">#TITRE</h2>
					[<div class="sous-titre texte-colorGrisFonce font-style-italic #EDIT{soustitre}">(#SOUSTITRE)</div>]
				</div>
			</a>
		</article>
		</BOUCLE_a>
	</div>
	</B_a>
	<B_r>
	<div class="large-8 columns avec-margin-top avec-margin-bottom avec-padding-bottom">
		<BOUCLE_r(RUBRIQUES){id_parent}{par num titre}>
		<article class="focus row text-center">
			<a href="#URL_RUBRIQUE" title="Lire [(#TITRE|attribut_html)]">
				<div class="large-6	columns avec-padding-bottom avec-margin-bottom">
					[(#REM) img 400x290 ]
					[<img src="(#LOGO_RUBRIQUE_NORMAL|focusimage{400,290,center}|extraire_attribut{src})" alt="">]
				</div>
				<div class="large-6	columns large-text-left">
					<h2 class="position-relative z-index-999 #EDIT{titre}">#TITRE</h2>
					[<div class="sous-titre texte-colorGrisFonce font-style-italic #EDIT{descriptif}">(#DESCRIPTIF)</div>]
				</div>
			</a>
		</article>
		</BOUCLE_r>
	</div>
	</B_r>
	<//B_a>

	<aside class="large-4 columns avec-margin-top avec-margin-bottom">
		<INCLURE{fond=_bibliotheque/pave-plusloin,id_rubrique,large=hide,env,ajax} />

		<INCLURE{fond=_bibliotheque/pave-evenement-rubrique,env,ajax} />

		<INCLURE{fond=_bibliotheque/pave-plusloin,id_rubrique,large=show,env,ajax} />

	</aside>

</div>
</BOUCLE_>
